<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Graph Explorer Parameter Tests</title>
  <style>
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: Georgia, "Times New Roman", serif;
      color: #1f2a37;
      background: #f5f1e8;
    }

    h1 {
      margin-top: 0;
    }

    .summary {
      margin: 1rem 0;
      padding: 0.85rem 1rem;
      border: 1px solid #d7cdbd;
      border-radius: 12px;
      background: #fffaf2;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fffaf2;
    }

    th,
    td {
      padding: 0.5rem 0.6rem;
      border: 1px solid #d7cdbd;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #d9efe8;
    }

    .pass {
      color: #1e6f5c;
      font-weight: 700;
    }

    .fail {
      color: #b45309;
      font-weight: 700;
    }

    iframe {
      width: 1px;
      height: 1px;
      border: 0;
      position: absolute;
      left: -9999px;
    }
  </style>
</head>
<body>
  <h1>Parameter Tests</h1>
  <p>These tests load the real explorer in a hidden iframe and check the parameter values exposed by the app test API.</p>
  <div id="summary" class="summary">Running...</div>
  <table>
    <thead>
      <tr>
        <th>Case</th>
        <th>Check</th>
        <th>Expected</th>
        <th>Actual</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>
  <iframe id="appFrame" src="../index.html" title="Mini Graph Explorer test target"></iframe>

      {
        name: "Compact P3 adjacency matrix",

          name: "Adjacency matrix graph (3 vertices)",

        }
      }

      {
        name: "Contract edge rewires neighbors",
        setup: "P4",
        run: (api) => api.contractEdge("B", "C"),
        expected: {
          vertexCount: "3",
          edgeCount: "2",
          vertices: "A,B,D",
          edges: "A-B,B-D"
        }
      },
      {
        name: "Batch merge pairs accepts quoted lists",
        setup: "C4",
        run: (api) => api.mergeVertices('"A,B"', '"C,D"'),

          vertexCount: "2",
          edgeCount: "1",

          edges: "A-B"
        }
      },
      {
        name: "Merge nonadjacent vertices removes duplicate edges",

      {
        name: "Nonsquare matrix rejection",

      },
      {
        name: "Loop matrix rejection",
        matrix: "1 0\n0 0",

      },
      {
        name: "Asymmetric matrix rejection",
        matrix: "0 1\n0 0",
        expected: "Adjacency matrix must be symmetric for an undirected graph."
      }

      {
        name: "C4 spectrum",
        description: "C4",
        expected: "2, 0^{2}, -2"
      }
    ];

    const laplacianSpectrumCases = [
      {
        name: "K3 Laplacian spectrum",
        description: "K3",
        expected: "3^{2}, 0"
      },
      {
        name: "P3 Laplacian spectrum",
        description: "P3",
        expected: "3, 1, 0"
      },
      {
        name: "C4 Laplacian spectrum",
        description: "C4",
        expected: "4, 2^{2}, 0"
      }
    ];

    const frame = document.getElementById("appFrame");
    const summary = document.getElementById("summary");
    const results = document.getElementById("results");

    function waitForApi() {
      return new Promise((resolve, reject) => {
        const started = Date.now();
        const timer = setInterval(() => {
          const api = frame.contentWindow && frame.contentWindow.MiniGraphExplorerTestAPI;
          if (api) {
            clearInterval(timer);
            resolve(api);
            return;
          }

          if (Date.now() - started > 5000) {
            clearInterval(timer);
            reject(new Error("MiniGraphExplorerTestAPI was not found."));
          }
        }, 50);
      });
    }

    function getActual(snapshot, key) {
      if (key === "vertexCount" || key === "edgeCount") {
        return String(snapshot[key]);
      }

      return snapshot.parameters[key] ? snapshot.parameters[key].value : "(missing)";
    }

    function addRow(caseName, key, expected, actual) {
      const passed = expected === actual;
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${caseName}</td>
        <td>${key}</td>
        <td>${expected}</td>
        <td>${actual}</td>
        <td class="${passed ? "pass" : "fail"}">${passed ? "PASS" : "FAIL"}</td>
      `;
      results.append(row);
      return passed;
    }

    function checkObject(caseName, actualObject, expectedObject) {
      let passed = 0;
      let total = 0;

      for (const [key, expected] of Object.entries(expectedObject)) {
        const actual = String(actualObject[key]);
        total += 1;
        if (addRow(caseName, key, expected, actual)) {
          passed += 1;
        }
      }

      return { passed, total };
    }

    function summarizeEditSnapshot(snapshot) {
      const edges = snapshot.edges
        .map((edge) => [edge.from, edge.to].sort().join("-"))
        .sort()
        .join(",");

      return {
        vertexCount: String(snapshot.vertexCount),
        edgeCount: String(snapshot.edgeCount),
        vertices: snapshot.vertices.slice().sort().join(","),
        edges
      };
    }

    async function runTests() {
      const api = await waitForApi();
      let passed = 0;
      let total = 0;

      for (const testCase of cases) {
        const snapshot = testCase.run
          ? testCase.run(api)
          : api.loadGraph(testCase.description);

        for (const [key, expected] of Object.entries(testCase.expected)) {
          const actual = getActual(snapshot, key);
          total += 1;
          if (addRow(testCase.name, key, expected, actual)) {
            passed += 1;
          }
        }
      }

      for (const testCase of parserCases) {
        const parsed = api.parseGraph(testCase.description);
        const result = checkObject(testCase.name, parsed, testCase.expected);
        passed += result.passed;
        total += result.total;
      }

      for (const testCase of editCases) {
        api.loadGraph(testCase.setup);
        const snapshot = testCase.run(api);
        const result = checkObject(testCase.name, summarizeEditSnapshot(snapshot), testCase.expected);
        passed += result.passed;
        total += result.total;
      }

      for (const testCase of matrixCases) {
        const snapshot = api.loadMatrix(testCase.matrix);
        const actual = {
          name: snapshot.name,
          vertexCount: String(snapshot.vertexCount),
          edgeCount: String(snapshot.edgeCount),
          connected: getActual(snapshot, "connected"),
          treewidth: getActual(snapshot, "treewidth"),
          chromaticNumber: getActual(snapshot, "chromaticNumber"),
          girth: getActual(snapshot, "girth")
        };
        const result = checkObject(testCase.name, actual, testCase.expected);
        passed += result.passed;
        total += result.total;
      }

      for (const testCase of matrixErrorCases) {
        let actual = "(no error)";
        try {
          api.parseMatrix(testCase.matrix);
        } catch (error) {
          actual = error.message;
        }

        total += 1;
        if (addRow(testCase.name, "matrix error", testCase.expected, actual)) {
          passed += 1;
        }
      }

      for (const testCase of spectrumCases) {
        const actual = api.spectrum(testCase.description);
        total += 1;
        if (addRow(testCase.name, "spectrum", testCase.expected, actual)) {
          passed += 1;
        }
      }

      for (const testCase of laplacianSpectrumCases) {
        const actual = api.laplacianSpectrum(testCase.description);
        total += 1;
        if (addRow(testCase.name, "Laplacian spectrum", testCase.expected, actual)) {
          passed += 1;
        }
      }

      for (const testCase of minorCases) {
        const result = api.findMinor(testCase.host, testCase.target);
        total += 1;
        if (addRow(testCase.name, "minor result", testCase.expected, result.text)) {
          passed += 1;
        }

        if (testCase.witnessIncludes) {
          total += 1;
          const hasWitnessText = result.witness.includes(testCase.witnessIncludes) ? testCase.witnessIncludes : result.witness || "(empty)";
          if (addRow(testCase.name, "minor witness", testCase.witnessIncludes, hasWitnessText)) {
            passed += 1;
          }
        }

        total += 1;
        const expectedHighlight = testCase.expected === "Yes" ? "minor:highlighted" : "none";
        const actualHighlight = result.highlight && result.highlight.groupCount > 0 && result.highlight.segmentCount > 0
          ? `${result.highlight.mode}:highlighted`
          : "none";
        if (addRow(testCase.name, "minor highlight", expectedHighlight, actualHighlight)) {
          passed += 1;
        }
      }

      for (const testCase of containmentCases) {
        const result = api.findContainment(testCase.host, testCase.target, testCase.mode);
        total += 1;
        if (addRow(testCase.name, `${testCase.mode} result`, testCase.expected, result.text)) {
          passed += 1;
        }

        if (testCase.witnessIncludes) {
          total += 1;
          const hasWitnessText = result.witness.includes(testCase.witnessIncludes) ? testCase.witnessIncludes : result.witness || "(empty)";
          if (addRow(testCase.name, `${testCase.mode} witness`, testCase.witnessIncludes, hasWitnessText)) {
            passed += 1;
          }
        }

        total += 1;
        const expectedHighlight = testCase.expected === "Yes" ? `${testCase.mode}:highlighted` : "none";
        const actualHighlight = result.highlight && result.highlight.groupCount > 0 && result.highlight.segmentCount > 0
          ? `${result.highlight.mode}:highlighted`
          : "none";
        if (addRow(testCase.name, `${testCase.mode} highlight`, expectedHighlight, actualHighlight)) {
          passed += 1;
        }
      }

      summary.textContent = `${passed}/${total} checks passed.`;
      summary.className = `summary ${passed === total ? "pass" : "fail"}`;
    }

    frame.addEventListener("load", () => {
      runTests().catch((error) => {
        summary.textContent = error.message;
        summary.className = "summary fail";
      });
    });
  </script>
</body>
</html>
