<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Graph Explorer</title>
  <link rel="stylesheet" href="styles/main.css?v=parameter-tooltips-2">
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Mini Graph Explorer</h1>
      <p class="byline">
        Built by
        <a href="https://sites.google.com/view/yixuanhuang/about-me" target="_blank" rel="noopener noreferrer">Yixuan Huang</a>
        with AI assistance from Codex
      </p>
    </section>

    <section class="panel prompt-panel">
      <div class="prompt-main">
        <div>
          <label for="descriptionInput">Describe a graph</label>
          <div class="description-row">
            <textarea id="descriptionInput" rows="2" placeholder="Examples: C3, K5, Petersen graph, L(K5), Cartesian product of C4 and P3"></textarea>
            <button id="generateGraphBtn">Generate</button>
          </div>
        </div>
        <div class="primary-controls">
          <div class="save-inline">
            <label for="saveGraphNameInput">Save current graph as</label>
            <div class="save-row">
              <input id="saveGraphNameInput" type="text" placeholder="G">
              <button id="saveGraphBtn" type="button" class="secondary">Save</button>
            </div>
          </div>
        </div>
      </div>

      <div class="top-tools">
        <button type="button" class="tool-tab" data-tool-tab="matrix" aria-expanded="false" aria-controls="matrixToolPanel">Adjacency matrix</button>
        <button type="button" class="tool-tab" data-tool-tab="saved" aria-expanded="false" aria-controls="savedToolPanel">Saved graphs</button>
        <button type="button" class="tool-tab" data-tool-tab="dictionary" aria-expanded="false" aria-controls="dictionaryToolPanel">Dictionary</button>
      </div>

      <div class="top-tool-panels">
        <section id="matrixToolPanel" class="tool-panel matrix-input-panel compact-details" data-tool-panel="matrix">
          <div class="matrix-body">
            <div>
              <label for="matrixInput">Paste matrix</label>
              <textarea id="matrixInput" placeholder="Example for P_3:
0 1 0
1 0 1
0 1 0"></textarea>
            </div>
            <button id="generateMatrixBtn" type="button" class="secondary">Load Matrix</button>
          </div>
        </section>

        <section id="savedToolPanel" class="tool-panel saved-graphs compact-details" data-tool-panel="saved" aria-label="Saved graphs">
          <p class="saved-graph-note">Save a graph as G, H, or a custom name, then reuse it in descriptions.</p>
          <div id="savedGraphList" class="saved-graph-list"></div>
        </section>

        <section id="dictionaryToolPanel" class="tool-panel dictionary compact-details" data-tool-panel="dictionary">
          <input id="dictionarySearch" class="dictionary-search" type="search" placeholder="Search: cycle, Petersen, line graph, complement, Cartesian product...">
          <div id="dictionaryList" class="dictionary-list"></div>
        </section>
      </div>
    </section>

    <section class="layout">
      <aside class="panel">
        <h2>Manual Edits</h2>

        <div>
          <label for="nodeInput">Add/delete vertex</label>
          <input id="nodeInput" type="text" placeholder="A">
        </div>
        <div class="button-row">
          <button id="addNodeBtn">Add</button>
          <button id="deleteNodeBtn" class="secondary">Delete</button>
        </div>

        <div>
          <label>Add/delete edge</label>
          <div class="control-grid">
            <input id="fromInput" type="text" placeholder="from" aria-label="Edge from">
            <input id="toInput" type="text" placeholder="to" aria-label="Edge to">
          </div>
        </div>
        <div class="button-row">
          <button id="addEdgeBtn">Add</button>
          <button id="deleteEdgeBtn" class="secondary">Delete</button>
        </div>
        <div class="button-row">
          <button id="undoBtn" class="secondary">Undo</button>
          <button id="redoBtn" class="secondary">Redo</button>
        </div>

        <div class="size-row">
          <div class="size-row-header">
            <label for="sizeSlider">Vertex size</label>
            <output id="sizeValue" for="sizeSlider">14 px</output>
          </div>
          <input id="sizeSlider" type="range" min="3" max="42" step="1" value="14">
        </div>

        <div class="color-row">
          <div>
            <label for="nodeColorInput">Vertex color</label>
            <input id="nodeColorInput" type="color" value="#1e6f5c">
          </div>
          <div>
            <label for="edgeColorInput">Edge color</label>
            <input id="edgeColorInput" type="color" value="#8b6f47">
          </div>
        </div>

        <button id="resetBtn" class="secondary">Clear Graph</button>

        <div id="status" class="status">Your graph is empty. Add a vertex to begin.</div>
        <div id="listBox" class="list"></div>
      </aside>

      <section class="panel">
        <div class="graph-view-header">
          <h2>Graph View</h2>
          <div class="graph-view-tools">
            <a class="readme-link" href="https://github.com/YixHuang/Mini-Graph-Explorer#readme" target="_blank" rel="noopener noreferrer">Parameter logic</a>
            <div class="toggle-row view-label-toggle">
              <input id="labelToggle" type="checkbox" checked>
              <label for="labelToggle">Show vertex labels</label>
            </div>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="graphCanvas" width="700" height="520" aria-label="Graph visualization"></canvas>
        </div>
        <div id="propertyBox" class="property"></div>
      </section>
    </section>
  </main>

  <script src="scripts/app.js?v=parameter-tooltips-2" defer></script>
</body>
</html>
